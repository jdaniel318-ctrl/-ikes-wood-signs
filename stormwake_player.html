3,y:57},\n{id:'cargo',title:'A fair share for every boat',zone:'The Supply Pier',kind:'number',story:'Twelve food crates must reach three rescue boats. Give each boat the same number so nobody is left short.',prompt:'12 crates \u00f7 3 boats = ?',answer:4,unit:'crates per boat',hint:'Deal the crates one at a time: one for each boat, then another round. Four rounds use all twelve.',visual:'crates',success:'Four crates aboard each boat. The three crews wave their thanks and cast off.',reward:'Rescue boats supplied',x:46,y:70},\n{id:'channel',title:'Read the water',zone:'The Lantern Passage',kind:'choice',story:'A stone arch points toward a tempting shortcut. Bootstrap spots white breakers beneath it. The green buoys mark the sheltered water. Choose our passage.',choices:[['arch','Under the stone arch'],['channel','Between the green buoys'],['open','Toward the open storm']],answer:'channel',hint:'Breaking white water means shallow rock. The green-marked channel gives us room.',success:'The launch slips between the buoys. Behind you, a wave breaks over the shortcut. Good observation beats a hurried guess.',reward:'Hidden channel charted',x:60,y:49},\n{id:'sail',title:'Catch enough wind',zone:'The Windward Reach',kind:'number',story:'The sail has eight panels. Bootstrap suggests raising three quarters of it while the gusts settle. Split eight into four equal groups; use three groups.',prompt:'\u00be of 8 sail panels = ?',answer:6,unit:'panels',hint:'Eight divided into four groups gives two panels per group. Three groups of two make six.',visual:'sail',success:'Six panels fill with wind. Your launch rounds the point without fighting the gusts.',reward:'Balanced sail set',x:73,y:36},\n{id:'gate',title:'The last harbor gate',zone:'The Beacon Lock',kind:'number',story:'Two matching counterweights and a fixed three-unit chain balance an eleven-unit gate. Find the weight of each matching block. The rescued boats are waiting.',prompt:'2x + 3 = 11. What is x?',answer:4,unit:'units per block',hint:'Remove the fixed three: 11 \u2212 3 = 8. Split eight equally between the two blocks: x = 4.',visual:'balance',success:'The gate rises. All three rescue boats enter safe water. Together you relight the beacon. This harbor has a future.',reward:'First Light \u00b7 fictional expedition complete',x:86,y:23}\n]);\nconst lessons=Object.freeze([\n{id:'fraction',title:'Shares of a sail',topic:'Fractions',teach:false,prompt:'Write three quarters as a decimal.',answer:.75,unit:'of the whole sail',demo:'A whole sail has four equal panels. Three panels out of four is 3 \u00f7 4 = 0.75.',hint:'Divide 3 by 4. Equivalent fractions are accepted.',art:'fraction'},\n{id:'area',title:'Repair the deck',topic:'Geometry',teach:false,prompt:'A rectangular deck is 4 m long and 3 m wide. What is its area?',answer:12,unit:'square metres',demo:'Area counts equal square tiles. Four rows with three tiles in each row gives 4 \u00d7 3.',hint:'Multiply length by width, not the distance around the edge.',art:'area'},\n{id:'algebra',title:'Balance the gate',topic:'Algebra',teach:false,prompt:'Solve 2x + 3 = 11.',answer:4,unit:'units per block',demo:'Doing the same operation on both sides keeps a balance level. Subtract 3, then divide by 2.',hint:'2x = 8, so x = 4.',art:'balance'},\n{id:'function',title:'Read a changing journey',topic:'Beyond algebra \u00b7 Functions',teach:true,prompt:'In this simplified model, distance d(t) = t\u00b2 metres. How far at t = 3 seconds?',answer:9,unit:'metres',demo:'A function is a rule connecting an input and an output. Here t is elapsed time in seconds. Put 2 into d(t) = t\u00b2: 2 \u00d7 2 = 4 metres. The curve shows that equal time steps need not add equal distances.',hint:'Replace t with 3: d(3) = 3 \u00d7 3.',art:'curve'},\n{id:'derivative',title:'Speed at one instant',topic:'Calculus \u00b7 Derivatives',teach:true,prompt:'For d(t) = t\u00b2 metres, the speed rule is v(t) = 2t m/s. What is the speed at t = 4 seconds?',answer:8,unit:'metres per second',demo:'Average speed uses distance change divided by time change. For d(t) = t\u00b2, the slope from t to t + h is ((t + h)\u00b2 \u2212 t\u00b2) / h = 2t + h. As h approaches zero, this approaches 2t. That limiting slope is the instantaneous speed: d\u2032(t) = 2t. At t = 3 it is 6 m/s. This is a toy motion model, not live navigation.',hint:'The derivative gives a rate, not total distance. Substitute 4 into 2t.',art:'derivative'},\n{id:'integral',title:'Gather what flows',topic:'Calculus \u00b7 Accumulation',teach:true,prompt:'A pump flows at q(t) = 2t litres/minute. Starting empty, how many litres enter from t = 0 to t = 4 minutes?',answer:16,unit:'litres',demo:'An integral accumulates a changing rate. On this graph, rate rises in a straight line from 0 to 8 L/min over four minutes. The area under that line is a triangle: \u00bd \u00d7 4 min \u00d7 8 L/min = 16 L. In symbols, \u222b\u2080\u2074 2t dt = [t\u00b2]\u2080\u2074 = 16. Rate units multiplied by time give an amount.',hint:'Use the triangle under the flow graph: half \u00d7 base 4 \u00d7 height 8.',art:'integral'}\n]);\nfunction number(value){if(typeof value!=='string'||value.length>64)return null;const v=value.trim().replace(/\u2212/g,'-');const atom='[+-]?(?:\\\\d+(?:\\\\.\\\\d*)?|\\\\.\\\\d+)';if(!new RegExp('^'+atom+'(?:\\\\s*/\\\\s*'+atom+')?$').test(v))return null;const p=v.split('/').map(Number),n=p.length===2?p[0]/p[1]:p[0];return Number.isFinite(n)?n:null;}\nfunction fresh(){return {schema:'fun-solo-v1',stage:0,history:[],help:0,mistakes:0,completed:false,lessons:[],pennant:'gold'};}\nfunction validate(s){const keys=['schema','stage','history','help','mistakes','completed','lessons','pennant'];if(!s||Array.isArray(s)||typeof s!=='object'||Object.keys(s).length!==keys.length||Object.keys(s).some(k=>!keys.includes(k)))throw Error('Not a FUN first-draft save. No game progress changed.');if(s.schema!=='fun-solo-v1'||!Number.isInteger(s.stage)||s.stage<0||s.stage>missions.length||s.completed!= function journal(){const m=state.mission;panel('journal',`<span class="eyebrow">Bootstrap's journal</span><h2>A sound ship.<br>A clear heading.</h2><p>${escape(S.goal(state).title)}. ${escape(S.goal(state).hint)}</p><div class="statRow"><div><b>${m.parts.length}/3</b><span>Launch repairs</span></div><div><b>${m.passenger?'Safe':'Waiting'}</b><span>Chartmaker</span></div><div><b>${m.chart?'Found':'Hidden'}</b><span>Old chart fragment</span></div></div><div class="grid"><button id="swOriginal"><small>Preserved adventure</small>First Light &amp; Chart Room →</button><button id="swFunctions"><small>Learn by moving</small>Time, distance &amp; a launch →</button><button id="swHelp"><small>Ask Bootstrap</small>Help with this passage →</button><button id="swSettings"><small>Play your way</small>Controls &amp; settings →</button></div><p class="note">${state.legacy.completed?'Your completed First Light voyage is preserved. Your '+escape(state.legacy.pennant)+' pennant flies on the launch.':'Load your original FUN file with the toolbar above to carry your First Light voyage and pennant forward.'} Game progress never grants real fleet authority.</p><div class="buttons"><button id="swBack" class="gold">Back to the harbor →</button><button id="swReplay">Replay this rescue</button></div>`);$('swOriginal').onclick=openLegacy;$('swFunctions').onclick=functionsLesson;$('swSettings').onclick=settings;$('swHelp').onclick=help;$('swBack').onclick=()=>renderer&&!renderLost?resume():title();$('swReplay').onclick=()=>{panel('reset',`<span class="eyebrow">New attempt</span><h2>Replay the Broken Passage?</h2><p>This replaces this rescue's in-memory progress. First Light and your lesson results stay intact. Save a game file above first to keep this run.</p><div class="buttons"><button id="swCancel">Keep this voyage</button><button id="swConfirmReplay" class="gold">Begin a fresh rescue</button></div>`);$('swCancel').onclick=journal;$('swConfirmReplay').onclick=()=>{const next=S.fresh(state.le function help(){const m=state.mission;let line=!m.briefed?'Walk toward the amber diamond above me, then press Interact. I am waiting on the paved quay.':m.parts.length<3?'Three items glow around the harbor: timber beside the market, rope beyond the eastern workshop, and the gear at the end of the pier. The short break in the pier is a jump, not a wall. Start the jump near the gold edge.':!m.bridgeOpen?'At the mechanism, two matching weights plus the fixed 3 must equal 11. Subtract the chain: 11 − 3 = 8. Divide that equally: 4 in each weight. The beam shows the balance as you change it.':!m.passenger?'Board the launch from the side arm of the pier. Go straight past the pier before turning; pull back to reverse away from an obstruction. Steer between the two towers, then sail toward the green berth at the northern cottage. Release the stick or hold Brake before docking. Meet the chartmaker ashore.':!m.complete?'Take the chartmaker aboard your launch and return to the amber berth by the lighthouse. Slow down, dock, and walk over to me at the landing.':'You brought our chartmaker home. The hidden chart is behind the rope store, west of the market. The original expedition and all six lessons remain in the journal.';panel('help',`<span class="eyebrow">Bootstrap · your first mate</span><h2>One thing at a time.</h2><p>${line}</p><div class="buttons"><button class="gold" id="swHelpBack">Back to the harbor →</button></div>`);$('swHelpBack').onclick=resume;}
function settings(){panel('settings',`<span class="eyebrow">Controls &amp; comfort</span><h2>Make yourself at home.</h2><p><b>On foot:</b> left stick moves; drag the world to look. Jump crosses the break in the pier. Interact works when you are close.</p><p><b>At the helm:</b> forward/reverse with the stick; left/right steers. Release it or hold Brake to slow down. Dock appears only at marked berths.</p><p class="note">Keyboard: WASD or arrows · Space jumps/brakes · E interacts · Escape pauses. Camera recenters behind the current character or launch.</p><label><input id="swSound" type="checkbox" ${state.prefs.sound?'checked':''}> Sound &amp; harbor cues</label><label><input id="swReduced" type="checkbox" ${state.prefs.reducedMotion?'checked':''}> Reduced motion</label><label>Graphics quality <select id="swQuality"><option value="low">Low — simplest lighting</option><option value="balanced">Balanced — recommended</option><option value="high">High — sharper picture</option></select></label><p class="note">Quality affects drawing resolution and shadows, not the mission. Your iPad's actual performance is the deciding test.</p><div class="buttons"><button id="swSettingsBack" class="gold">Return →</button></div>`);$('swQuality').value=state.prefs.quality;$('swSound').onchange=e=>{act({type:'prefs',prefs:{sound:e.target.checked}});audio.enable(e.target.checked);audio.cue('collect');};$('swReduced').onchange=e=>act({type:'prefs',prefs:{reducedMotion:e.target.checked}});$('swQuality').onchange=e=>{act({type:'prefs',prefs:{quality:e.target.value}});renderer?.resize(state.prefs.quality);};$('swSettingsBack').onclick=()=>$('swHud').hidden?title():resume();}
function nearAction(){if(mode==='boat'){const dock=boat.dock();if(dock&&(dock!=='lighthouse'||state.mission.passenger))return{id:'dock',where:dock,text:'Dock · '+({arrival:'Loading pier',chartmaker:'Chartmaker',lighthouse:'Lighthouse'}[dock])};return null;}const m=state.mission;const dist=p=>Math.hypot(hero.x-p[0],hero.z-p[1]);if(!hero.grounded)return null;let options=[];if(dist(m.passenger?S.TARGETS.lighthouse:S.TARGETS.bootstrap)<2.7)options.push({id:m.passenger?'finish':'talk',text:m.passenger?'Meet Bootstrap':'Talk to Bootstrap'});if(m.briefed)for(const id of S.PARTS)if(!m.parts.includes(id)&&dist(S.TARGETS[id])<1.85)options.push({id:'collect',piece:id,text:'Collect '+({timber:'timber',rope:'rope',gear:'bridge gear'}[id])});if(!m.chart&&dist(S.TARGETS.chart)<1.8)options.push({id:'chart',text:'Recover old chart'});if(m.parts.length===3&&!m.bridgeOpen&&dist(S.TARGETS.mechanism)<2.5)options.push({id:'mechanism',text:'Balance the bridge'});if(m.bridgeOpen&&!m.passenger&&dist(S.TARGETS.chartmaker)<2.6)options.push({id:'rescue',text:'Meet the chartmaker'});if(m.parts.length===3&&Math.hypot(hero.x-boat.x,hero.z-boat.z)<4.7)options.push({id:'board',text:'Board the launch'});return options[0]||null;}
function interact(){if(modal)return;const n=nearAction();if(!n){toast(mode==='boat'?'Release the stick to slow down. Approach a marked berth to dock.':'Move closer to a person, a glowing repair, or a mechanism.',4);return;}hero.interacting=.6;switch(n.id){case'talk':panel('talk',`<span class="eyebrow">Bootstrap · The Broken Passage</span><h2>The lighthouse is holding.<br>The pier isn't.</h2><p>Our chartmaker is stranded beyond the passage. Find <b>timber, rope, and the bridge gear</b> around the quay. Then balance the mechanism, take the launch, and bring our people home.</p><p class="note">Follow the amber diamond. There is no timer. A missed jump returns you to a safe dock; collected repairs stay yours.</p><div class="buttons"><button id="swAcceptMission" class="gold">I'm on it →</button></div>`);$('swAcceptMission').onclick=()=>{act({type:'talk'});resume();audio.cue('collect');};break;case'collect':act({type:'collect',id:n.piece});audio.cue('collect');toast(state.mission.parts.length===3?'All three repair pieces recovered. Head to the balance mechanism beside the pier.':n.piece==='gear'?'Bridge gear secured. Keep searching for the remaining launch parts.':n.piece==='rope'?'Rope secured. The launch is taking shape.':'Timber recovered. One sound piece at a time.');break;case'chart':act({type:'chart'});audio.cue('collect');toast('Hidden chart found. A pencilled coastline leads beyond the fog.',8);break;case'mechanism':mechanism();break;case'board':mode='boat';boat.speed=0;clearInput();camYaw=boat.yaw;toast('At the helm. Push up to accelerate. Steer through the passage; brake near a berth.',7);audio.cue('gate');break;case'dock':if(n.where==='chartmaker'&&!state.mission.bridgeOpen)return;if(n.where==='lighthouse'&&!state.mission.passenger)return;mode='walk';hero.checkpoint=n.where;hero.respawn();hero.yaw=n.where==='chartmaker'?Math.PI/2:n.where==='lighthouse'?-Math.PI/2:Math.PI;act({type:'checkpoint',id:n.where});boat.reset(n.where);clearInput();camYaw=hero.yaw;toast('Safely moored. Step ashore and follow the marker.',4);break;case'rescue':panel('rescue',`<span class="eyebrow">The chartmaker</span><h2>You found the passage.</h2><p>“I thought the storm had swallowed the loading bridge. My charts are dry, and there's a coastline on one of them that needs a closer look.”</p><p>Return to the launch. Your passenger will board with you. Bring the boat to the amber lighthouse landing, then meet Bootstrap ashore.</p><div class="buttons"><button id="swRescue" class="gold">Let's get you home →</button></div>`);$('swRescue').onclick=()=>{act({type:'rescue'});resume();audio.cue('collect');toast('Chartmaker ready. Board the launch at the same berth.',5);};break;case'finish':if(!state.mission.passenger)return;act({type:'finish'});win();break;}updateHUD(true);}
function mechanism(){function render(feedback=''){panel('mechanism',`<span class="eyebrow">In the world · bridge counterweights</span><h2>Make both sides balance.</h2><p>Two matching weights and a fixed <b>3-unit chain</b> must balance <b>11</b>. Change both weights together. Watch the actual beam beside the pier.</p><div class="weightControl"><button id="swWeightMinus" aria-label="Remove one unit from each weight">−</button><b>${state.mission.weight}<small style="display:block;font-size:11px">units per weight</small></b><button id="swWeightPlus" aria-label="Add one unit to each weight">+</button></div><div class="equation">${state.mission.weight} + ${state.mission.weight} + 3 = <b>${2*state.mission.weight+3}</b><small style="display:block;margin-top:6px">TARGET: 11</small></div><p class="feedback" id="swWeightFeedback">${escape(feedback)}</p><div class="buttons"><button id="swBalance" class="gold">Test the balance →</button><button id="swWeightClose">Step away</button></div><button id="swWeightHint" style="margin-top:12px;width:100%">Ask Bootstrap</button>`);$('swWeightMinus').onclick=()=>{act({type:'weight',delta:-1});render();};$('swWeightPlus').onclick=()=>{act({type:'weight',delta:1});render();};$('swWeightClose').onclick=resume;$('swWeightHint').onclick=()=>render('Take away the chain: 11 − 3 = 8. Share 8 equally between the two weights.');$('swBalance').onclick=()=>{const res=act({type:'balance'});if(res.ok){resume();audio.cue('gate');toast('Balanced. The bridge is rising. Your launch waits beside the loading pier.',7);}else render(res.message);};}render();}
function win(){audio.cue('win');panel('win',`<span class="eyebrow">The Broken Passage · rescue complete</span><h2>A harbor worth coming home to.</h2><p>The launch settles at the landing. Your chartmaker is safe, the bridge is open, and Bootstrap has a kettle on. The beacon never stopped burning.</p><div class="statRow"><div><b>3/3</b><span>Launch repairs</span></div><div><b>Home</b><span>Chartmaker rescued</span></div><div><b>${state.mission.chart?'Found':'Waiting'}</b><span>Hidden chart</span></div></div><p>“That coastline on the chart?” Bootstrap grins. “Now that's a heading.”</p><p class="note">First 3D mission complete. New islands and invited players are later work—not unlocked services. Save your game file above to keep this voyage.</p><div class="buttons"><button id="swExplore" class="gold">Explore the harbor →</button><button id="swWinJournal">Open the journal</button></div>`);$('swExplore').onclick=resume;$('swWinJournal').onclick=journal;}
function functionsLesson(){let explored=false;panel('function',`<span class="eyebrow">Beyond algebra · learn by moving</span><h2>A journey that changes.</h2><p>Time is the input. Distance is the output. In this toy model, <b>d(t) = t²</b>, with seconds and metres. Move the slider: the little launch and its graph point move together.</p><div class="functionViz"><div class="boatTrack"><svg id="demoBoat" viewBox="0 0 40 40" aria-label="Model launch"><path d="M3 29h34l-7 9H12Z" fill="#e4bb72"/><path d="M20 2v25H6Z" fill="#f1e2bd"/><path d="M23 8v19h12Z" fill="#71b7b5"/></svg></div><svg id="functionGraph" viewBox="0 0 420 160" role="img" aria-label="Distance equals time squared"><path d="M38 10v118h355" fill="none" stroke="#7b9f9f"/><path d="M38 128L126 121 214 99 302 62 390 10" fill="none" stroke="#e8c271" stroke-width="3"/><g fill="#bbd4cf" font-size="13"><text x="35" y="149">0</text><text x="211" y="149">2</text><text x="385" y="149">4 s</text><text x="8" y="20">16</text><text x="6" y="103">4</text></g><circle id="graphPoint" cx="214" cy="99" r="6" fill="#7fddd1"/></svg><label for="swTime" class="visuallyHidden">Time in seconds</label><input type="range" id="swTime" min="0" max="4" step="0.1" value="2"><div class="lessonReadout"><span id="swTimeValue">t = 2 s</span><b id="swDistanceValue">d = 4 m</b></div></div><p id="swFunctionGuide">At 2 seconds: 2 × 2 = 4 metres. The distance does not grow by the same amount each second. Explore the slider before your turn.</p><div id="swFunctionPractice" hidden><p>At <b>t = 3 seconds</b>, how far has the launch travelled?</p><div class="lessonAnswer"><input id="swFunctionAnswer" type="text" inputmode="decimal" autocomplete="off" aria-label="Distance in metres"><span>metres</span><button id="swFunctionTry" class="gold">Try →</button></div><p id="swFunctionFeedback" class="feedback" role="status"></p></div><div class="buttons"><button id="swFunctionTurn" class="gold" disabled>Explore, then try it →</button><button id="swFunctionBack">Return to journal</button></div>`);
$('swTime').oninput=e=>{const t=Number(e.target.value),d=t*t;explored=true;$('demoBoat').style.left=d/16*100+'%';$('graphPoint').setAttribute('cx',String(38+t/4*352));$('graphPoint').setAttribute('cy',String(128-d/16*118));$('swTimeValue').textContent='t = '+t.toFixed(1)+' s';$('swDistanceValue').textContent='d = '+d.toFixed(2)+' m';$('swFunctionTurn').disabled=false;};$('demoBoat').style.left='25%';$('swFunctionTurn').onclick=()=>{if(!explored)return;$('swFunctionPractice').hidden=false;$('swFunctionTurn').hidden=true;$('swFunctionAnswer').focus();};$('swFunctionTry').onclick=()=>{const res=act({type:'function',value:$('swFunctionAnswer').value});$('swFunctionFeedback').textContent=res.ok?'Exactly: 3 × 3 = 9 metres. That is a distance, not a speed. Your lesson progress is kept separately from the rescue.':'Replace t with 3: d(3) = 3 × 3. The curve links time to distance.';if(res.ok)audio.cue('collect');};$('swFunctionAnswer').onkeydown=e=>{if(e.key==='Enter')$('swFunctionTry').click();};$('swFunctionBack').onclick=journal;}
function openLegacy(){clearInput();modal='legacy';$('swModal').hidden=true;const wrap=document.createElement('section');wrap.className='legacyShell';wrap.id='swLegacyShell';wrap.innerHTML='<header><span>Preserved First Light &amp; Chart Room</span><button id="swLegacyBack">← STORMWAKE</button></header>';legacyFrame=document.createElement('iframe');legacyFrame.title='Original FUN adventure and six lessons';legacyFrame.setAttribute('sandbox','allow-scripts');legacyFrame.setAttribute('allow',"camera 'none'; microphone 'none'; geolocation 'none'; payment 'none'");legacyChannel='legacy-'+Math.random().toString(36).slice(2)+'-'+Date.now();const f=legacyFrame;f.onload=()=>{if(legacyFrame===f)f.contentWindow.postMessage({type:'start',channel:legacyChannel,state:G.validate(state.legacy)},'*');};f.srcdoc=window.STORMWAKE_LEGACY_HTML;wrap.appendChild(f);$('swApp').appendChild(wrap);$('swLegacyBack').onclick=closeLegacy;}
function closeLegacy(){legacyFrame?.remove();legacyFrame=null;legacyChannel='';$('swLegacyShell')?.remove();journal();}
function graphicsError(message='The graphics context was interrupted.'){renderLost=true;clearInput();panel('graphics',`<span class="eyebrow">3D paused · progress retained</span><h2>The harbor needs its picture back.</h2><p id="swError"></p><p>Use Save Game File above to keep progress. A safe rebuild returns to your last named dock. The original First Light adventure still works without this 3D view.</p><div class="buttons"><button id="swRebuild" class="gold">Rebuild the 3D view</button><button id="swGraphicsLegacy">Play First Light</button></div>`);$('swError').textContent=String(message);$('swGraphicsLegacy').onclick=openLegacy;$('swRebuild').onclick=()=>{const saved=S.validate(state);initializeWorld(saved);if(!renderLost){$('swHud').hidden=false;resume();toast('View rebuilt at the last safe checkpoint.');}};}
function initializeWorld(s){generation++;renderer?.dispose();renderer=null;world=null;renderLost=false;state=S.validate(s);hero=new S.Character(state.mission.checkpoint);boat=new S.Boat(state.mission.checkpoint==='pier'?'arrival':state.mission.checkpoint);mode='walk';camYaw=state.mission.checkpoint==='chartmaker'?Math.PI/2:state.mission.checkpoint==='lighthouse'?-Math.PI/2:0;camPitch=.34;camera={eye:[hero.x,hero.y+4.6,hero.z-8.2],target:[hero.x,hero.y+1.2,hero.z]};try{renderer=new R.Renderer($('swCanvas'));renderer.resize(state.prefs.quality);renderer.onLost=()=>graphicsError('The browser lost its graphics context. No game progress was discarded.');renderer.onRestored=()=>{renderLost=true;graphicsError('Graphics are available again. Rebuild the view when ready.');};world=StormwakeWorld.create();}catch(e){graphicsError(e.message||e);}lastTime=0;updateHUD(true);}
function restore(s){clearInput();legacyFrame?.remove();legacyFrame=null;$('swLegacyShell')?.remove();initializeWorld(s);if(!renderLost)title();}
function updateHUD(force=false){if(!state||!$('swObjective'))return;const goal=S.goal(state),key=goal.id+state.mission.parts.join()+mode;if(force||key!==lastObjective){$('swObjective').textContent=goal.title;$('swObjectiveHint').textContent=goal.hint;$('swParts').innerHTML=S.PARTS.map(id=>'<span class="'+(state.mission.parts.includes(id)?'done':'')+'" aria-label="'+id+(state.mission.parts.includes(id)?' recovered':' to find')+'">'+id+'</span>').join('');const m=state.mission,stage=!m.briefed?0:m.parts.length<3?1:!m.bridgeOpen?2:!m.passenger?3:!m.complete?4:5;$('swStage').textContent=String(stage+1).padStart(2,'0')+' / 06';$('swStages').innerHTML=Array.from({length:6},(_,i)=>'<i class="'+(i<stage?'done':i===stage?'current':'')+'"></i>').join('');lastObjective=key;$('swJump').innerHTML=mode==='boat'?'■<br>Brake':'↑<br>Jump';$('swStickLabel').textContent=mode==='boat'?'THROTTLE · STEER':'MOVE';$('swSpeed').hidden=mode!=='boat';}
near=nearAction();const button=$('swInteract');button.textContent=near?.text||(mode==='boat'?'Approach a berth':'Move closer');button.classList.toggle('quiet',!near);const at=mode==='boat'?boat:hero,d=Math.hypot(goal.pos[0]-at.x,goal.pos[1]-at.z);$('swDistance').textContent=goal.id==='complete'?'Home':Math.round(d)+' m';const angle=Math.atan2(goal.pos[0]-at.x,goal.pos[1]-at.z)-camYaw;$('swNeedle').style.transform='rotate('+(-angle*180/Math.PI)+'deg)';if(mode==='boat')$('swSpeed').textContent=Math.abs(boat.speed).toFixed(1)+' m/s · '+(boat.dock()?'berth in reach':'release to slow');}
function updateCamera(dt){let target,desired;if(modal==='title'){const a=simTime*.012;target=[0,2,-4];desired=[26+Math.sin(a)*2,18,-35];}else if(modal==='mechanism'){target=[-1.8,3.1,21];desired=[4.5,5.4,17];}else{const p=mode==='boat'?[boat.x,1.3,boat.z]:[hero.x,hero.y+1.17,hero.z],dist=mode==='boat'?10.5:7.6;if(mode==='boat'&&input.camId===null)camYaw=S.angle(camYaw,boat.yaw,dt*1.6);target=p;desired=[p[0]-Math.sin(camYaw)*Math.cos(camPitch)*dist,p[1]+Math.sin(camPitch)*dist+1,p[2]-Math.cos(camYaw)*Math.cos(camPitch)*dist];}
const smoothing=state.prefs.reducedMotion?1:Math.min(1,dt*7);camera.target=camera.target.map((x,i)=>x+(target[i]-x)*smoothing);camera.eye=camera.eye.map((x,i)=>x+(desired[i]-x)*smoothing);if(modal!=='title'){let t=1;for(const b of S.OBSTACLES){const hit=S.rayBox(camera.target,camera.eye,[b[0]-.25,b[1]+.25,b[2]-.25,b[3]+.25,b[4]+.3]);if(hit!==null)t=Math.min(t,Math.max(.12,hit-.06));}if(t<1)camera.eye=R.V.add(camera.target,R.V.mul(R.V.sub(camera.eye,camera.target),t));camera.eye[1]=Math.max(.8,camera.eye[1]);}}
function loop(ts){if(!started)return;raf=requestAnimationFrame(loop);const dt=lastTime?S.clamp((ts-lastTime)/1000,0,.05):1/60;lastTime=ts;if(document.hidden||legacyFrame)return;simTime+=dt;if(!renderLost&&renderer&&world){if(!modal){const keys=input.keys,side=S.clamp(input.joyX+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),-1,1),forward=S.clamp(input.joyZ+(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0),-1,1);if(mode==='walk'){const v={x:Math.sin(camYaw)*forward-Math.cos(camYaw)*side,z:Math.cos(camYaw)*forward+Math.sin(camYaw)*side,sprint:keys.has('shift')};const res=hero.step(dt,v);if(res.fell){toast('Back on solid timber. Your collected repairs are still yours.',5);audio.cue('splash');}if(hero.grounded&&Math.abs(hero.x)<3&&hero.z>16&&hero.z<23&&state.mission.checkpoint!=='pier'){hero.checkpoint='pier';act({type:'checkpoint',id:'pier'});}if(hero.run>.2&&hero.grounded&&simTime-audio.lastFoot>.32){audio.lastFoot=simTime;audio.cue('step');}}else boat.step(dt,{throttle:input.brake||keys.has(' ')?0:forward,steer:-side},state.mission.bridgeOpen);}
updateCamera(dt);world.update(simTime,dt,state,hero,boat,mode,state.prefs.reducedMotion);renderer.draw(world.root,camera,state.prefs.reducedMotion?0:simTime);fpsSum+=dt;fpsN++;if(fpsN%4===0)updateHUD();if(toastUntil&&simTime>toastUntil){$('swToast').textContent='';toastUntil=0;}}
}
window.addEventListener('keydown',e=>{if(!started)return;if(e.key==='Escape'){e.preventDefault();if(legacyFrame)closeLegacy();else if(modal==='pause')resume();else pause();return;}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','shift','e'].includes(k)){e.preventDefault();if(modal)return;input.keys.add(k);if(k===' '&&!e.repeat&&mode==='walk')hero.jump();if(k==='e'&&!e.repeat)interact();}});window.addEventListener('keyup',e=>input.keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>hold('Paused while the game was out of focus.'));document.addEventListener('visibilitychange',()=>{clearInput();lastTime=0;if(document.hidden)hold('Paused while the game was in the background.');});window.addEventListener('resize',()=>{clearInput();lastTime=0;renderer?.resize(state?.prefs.quality);});
window.addEventListener('message',e=>{if(legacyFrame&&e.source===legacyFrame.contentWindow&&e.origin==='null'&&e.data?.channel===legacyChannel){if(e.data.type==='progress')act({type:'legacy',state:e.data.state});return;}if(e.source!==parent||parent===window||!e.data||typeof e.data.channel!=='string'||e.data.channel.length>160)return;const d=e.data;if(d.type==='start'&&!started){try{state=S.validate(d.state);}catch(_){return;}channel=d.channel;started=true;mount();initializeWorld(state);if(!renderLost)title();window.StormwakeSnapshot=()=>({mission:S.validate(state).mission,legacy:S.validate(state).legacy,prefs:{...state.prefs},player:{x:hero.x,y:hero.y,z:hero.z,yaw:hero.yaw,grounded:hero.grounded,phase:hero.phase},boat:{x:boat.x,z:boat.z,yaw:boat.yaw,speed:boat.speed},mode,modal,pauseReason,camYaw,camera:JSON.parse(JSON.stringify(camera)),near:nearAction(),renderer:renderer?{...renderer.stats}:null,contextLost:renderLost});send('ready');progress();raf=requestAnimationFrame(loop);}else if(started&&d.channel===channel){if(d.type==='restore'){try{restore(S.validate(d.state));progress();}catch(_){toast('Invalid game state ignored. Your last progress remains.');}}else if(d.type==='pause')hold(d.reason==='background'?'Paused while the game was in the background.':'Your voyage is held.');}});
window.addEventListener('pagehide',()=>{started=false;cancelAnimationFrame(raf);clearInput();renderer?.dispose();audio.dispose();});
})();
</script></body></html>
