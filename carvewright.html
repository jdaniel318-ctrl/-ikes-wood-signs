<main class="cw-landing"><span class="cw-landing-mark" aria-hidden="true">C</span><span class="cw-eyebrow">CARVEWRIGHT · DESIGN &amp; PRODUCTION</span><h1>Make something<br>worth making.</h1><p>Your independent workspace for sign layouts, saved designs and clear job handoffs.</p><button id="cwLaunch" type="button">Open Carvewright</button><p id="cwLaunchStatus" role="status">Local workspace · no sign-in required</p><small>8.8.20.55 · Fleet registration pending · Artwork exports, no toolpaths</small></main>

(function(){'use strict';function launch(){try{CarvewrightApp.open({scope:{accountId:'standalone-reference',backend:'offline-reference',environment:'reference',site:new URL('./',location.href).href,businessId:'carvewright'},guard:()=>true,parent:document.body,referenceOnly:true});document.getElementById('cwLaunchStatus').textContent='Local workspace · keep downloaded job files for portable copies.';}catch(e){document.getElementById('cwLaunchStatus').textContent=e.message||'Open the complete extracted Carvewright folder.';}}document.getElementById('cwLaunch').addEventListener('click',launch);launch();})();
