<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Owner Access</title><style>html,body{margin:0;background:#081116;color:#eef3f1;font-family:Arial,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,92vw);padding:30px;border:1px solid #39525d;border-radius:18px;background:#0d1b21;box-shadow:0 24px 60px #0008}.card small{color:#d3af59;font-weight:900;letter-spacing:.13em}.card h1{font-size:34px;margin:10px 0}.card p{color:#b6c3bf;line-height:1.55}.status{margin-top:18px;color:#8db8c8}</style></head><body><main><section class="card"><small>DARK SKY • BUSINESS PARTNER</small><h1>Opening your Business Portal…</h1><p>This entrance is project-scoped. It does not grant Black Flag Engine access.</p><div class="status" id="status">Resolving project…</div></section></main><script>(function(){const q=new URLSearchParams(location.search);const project=q.get('project')||location.hash.replace(/^#/,'');const status=document.getElementById('status');if(!project){status.textContent='This owner link is missing its project identifier.';return;}try{sessionStorage.setItem('darkSkyOwnerRouteArmV1',JSON.stringify({projectId:project,at:Date.now()}));}catch(_){}const target=new URL('./index.html',location.href);target.searchParams.set('surface','owner');target.searchParams.set('project',project);target.searchParams.set('view','login');target.hash='';location.replace(target.toString());})();</script></body></html>
