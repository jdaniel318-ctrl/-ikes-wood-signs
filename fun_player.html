".14"/>':''}<g stroke="#bfd5cc" fill="none" opacity=".28" transform="translate(749 440)"><circle r="45"/><circle r="31"/><path d="M0 -64V64M-64 0H64M-44 -44L44 44M44 -44L-44 44"/><path d="M0 -53L10 0L0 53L-10 0Z" fill="#a8c0b6"/></g><text x="749" y="365" text-anchor="middle" fill="#afc4b9" font-size="13" font-family="Georgia" opacity=".6">N</text><g fill="#102e39" opacity=".5"><path d="M40 183q18 -20 35 0q18 -20 35 0q-36 -12 -70 0"/><path d="M414 160q12 -13 23 0q12 -13 23 0q-24 -8 -46 0"/></g></svg>`;}
function ship(){const p=G.missions[Math.min(state.stage,G.missions.length-1)],c={gold:'#f4cc76',teal:'#65d4c8',coral:'#e69d82'}[state.pennant];return `<div class="ship" style="left:${p.x}%;top:${p.y}%"><svg viewBox="0 0 64 70" aria-hidden="true"><ellipse cx="32" cy="62" rx="26" ry="5" fill="#8ee0d5" opacity=".22"/><path d="M6 49Q29 60 60 49L50 61H19Z" fill="#deb879"/><path d="M32 7V55" stroke="#f6e3ba" stroke-width="3"/><path d="M28 14L10 42H28Z" fill="#f6edce"/><path d="M36 19L51 43H36Z" fill="${c}"/><path d="M33 5L49 10L33 14Z" fill="${c}"/></svg></div>`;}
function map(){return `<section class="sea" aria-label="Fictional harbor map">${world()}<div class="map-caption"><span class="small">The first expedition</span><h1>First Light</h1><p>A harbor to restore.<br>A horizon to discover.</p></div>${G.missions.map((m,i)=>`<span class="station ${i<state.stage?'done':i===state.stage?'current':''}" style="left:${m.x}%;top:${m.y}%" aria-label="${esc(m.zone)}">${i<state.stage?'✓':i+1}</span>`).join('')}${ship()}<button class="secret" id="tern" aria-label="Inspect the little seabird">⌁</button><div class="map-stage"><strong>${state.completed?'The beacon is burning again.':esc(G.current(state).zone)}</strong><div class="meter"><span style="width:${state.stage/G.missions.length*100}%"></span></div><p>${state.stage} / ${G.missions.length} chapters complete · No timer. Your pace.</p></div></section>`;}
function visual(m){if(m.visual==='planks')return '<div class="visual" aria-label="Three planks plus four planks">'+Array.from({length:7},(_,i)=>(i===3?'<span class="visual-divider">+</span>':'')+'<i class="plank"></i>').join('')+'</div>';if(m.visual==='crates')return '<div class="visual boats" id="cargoVisual">'+[1,2,3].map(n=>`<div class="boatload"><b>Boat ${n}</b><span>Waiting for supplies</span></div>`).join('')+'</div>';if(m.visual==='sail')return '<div class="visual"><div class="sailgrid">'+Array.from({length:8},(_,i)=>`<span class="${i>=6?'dim':''}"></span>`).join('')+'</div></div>';if(m.visual==='balance')return '<div class="visual balance"><span>x + x + 3</span><span>=</span><span>11</span></div>';return '';}
function task(){if(finishMessage)return `<div class="task"><span class="small">A good decision changes the world</span><div class="success"><span class="small">${esc(G.missions[state.stage-1].reward)}</span><h3>${state.completed?'Welcome home, Admiral.':'One step closer.'}</h3><p>${esc(finishMessage)}</p></div><div class="actions"><button id="next" class="primary">${state.completed?'SEE THE HARBOR':'CONTINUE THE VOYAGE'} →</button></div></div>`;if(state.completed)return `<div class="task"><span class="small">First expedition complete · game only</span><h2>You brought the light back.</h2><p class="story">The rescue boats are home. Bootstrap hangs a fresh pennant above the jetty. You chose the clues, repaired the launch and opened the harbor—not by rushing, but by figuring things out.</p><div class="success"><h3>First Light</h3><p>A fictional voyage keepsake. Hints used: ${state.help}. Every hint was part of learning—not a penalty.</p></div><p class="story" style="margin-top:14px">Choose the pennant for your next horizon:</p><div class="pennants">${['gold','teal','coral'].map(c=>`<button data-pennant="${c}" aria-label="${c} pennant" aria-pressed="${state.pennant===c}">${state.pennant===c?'✓':''}</button>`).join('')}</div><div class="actions"><button id="charts" class="primary">EXPLORE THE CHART ROOM →</button></div>${replayPending?'<div class="replay-check"><p>Begin a new fictional expedition? Save this voyage above first to keep it.</p><button id="confirmReplay">BEGIN NEW EXPEDITION</button><button id="cancelReplay">KEEP THIS VOYAGE</button></div>':'<button id="replay" style="margin-top:10px">Replay expedition</button>'}<p class="story" style="margin-top:12px;font-size:12px">Invitations and community adventures come later. They are not enabled in this draft.</p></div>`;
const m=G.current(state);return `<div class="task"><span class="small">Chapter ${state.stage+1} / 6 · ${esc(m.zone)}</span><h2>${esc(m.title)}</h2><p class="story">${esc(m.story)}</p><div class="challenge">${visual(m)}${m.kind==='choice'?`<div class="choices">${m.choices.map(c=>`<button data-choice="${c[0]}">${esc(c[1])}</button>`).join('')}</div>`:`<p class="question">${esc(m.prompt)}</p><div id="answerForm" role="group" aria-label="Mission answer"><div class="answerrow"><input id="answer" value="${esc(answerDraft)}" autocomplete="off" inputmode="decimal" maxlength="64" aria-label="Your answer"><span class="unit">${esc(m.unit)}</span></div><div class="actions"><button class="primary" id="answerSubmit" type="button">PUT THE PLAN TO WORK →</button></div></div>`}<div class="actions"><button id="hint">ASK BOOTSTRAP</button></div><p id="feedback" class="feedback ${wrong?'wrong':''}" role="status" aria-live="polite">${esc(feedback)}</p></div></div>`;}
function graph(kind){
 const integral=kind==='integral',derivative=kind==='derivative',x=t=>35+t/4*275,y=v=>135-v/(integral?8:16)*110;
 const d=Array.from({length:81},(_,i)=>{const t=i/20;return (i?'L':'M')+x(t).toFixed(2)+' '+y(integral?2*t:t*t).toFixed(2);}).join(' ');
 const description=integral?'Flow rate q(t) equals 2t. At four minutes it is eight litres per minute. The triangle under the line has area sixteen litres.':derivative?'Distance d(t) equals t squared. The dashed tangent at four seconds has slope eight metres per second.':'Distance d(t) equals t squared. One second gives one metre, two gives four, three gives nine, and four gives sixteen.';
 return `<svg class="graph" viewBox="0 0 360 178" role="img" aria-label="${description}"><title>${description}</title><g stroke="#244a59">${[0,1,2,3,4].map(t=>`<path d="M${x(t)} 18V135"/>`).join('')}${[40,80,120].map(v=>`<path d="M35 ${v}H315"/>`).join('')}</g><path d="M35 15V135H325" stroke="#95b8b6" fill="none"/>${integral?`<path d="${d}L310 135Z" fill="#65d4c84a"/>`:''}<path d="${d}" stroke="${integral?'#65d4c8':'#f4cc76'}" fill="none" stroke-width="3"/>${derivative?`<path d="M${x(2)} ${y(0)}L${x(4)} ${y(16)}" stroke="#65d4c8" stroke-width="2" stroke-dasharray="4 3"/><circle cx="310" cy="25" r="5" fill="#65d4c8"/>`:''}${[0,1,2,3,4].map(t=>`<text x="${x(t)}" y="151" fill="#aac5c9" font-size="11" text-anchor="middle">${t}</text>`).join('')}<text x="23" y="30" fill="#aac5c9" font-size="11" text-anchor="end">${integral?'8':'16'}</text><text x="40" y="12" fill="#aac5c9" font-size="11">${integral?'rate (litres/min)':'distance (metres)'}</text><text x="190" y="174" fill="#aac5c9" font-size="11">${integral?'time (minutes)':'time (seconds)'}</text></svg>`;
}
function charts(){const l=G.lessons.find(l=>l.id===lesson);if(!l)return `<div class="task"><span class="small">Navigator’s Chart Room</span><h2>There is more beyond the horizon.</h2><p class="story">Try a small taste of the learning voyage. These are draft lessons—not a full course or a community qualifying exam. After algebra, Bootstrap demonstrates each new idea before your turn.</p><div class="chart-list">${G.lessons.map(l=>`<button data-lesson="${l.id}"><span>${esc(l.topic)}</span>${esc(l.title)}${state.lessons.includes(l.id)?' ✓':''}</button>`).join('')}</div><div class="actions"><button id="toHarbor">← RETURN TO HARBOR</button></div></div>`;return `<div class="task"><span class="small">${esc(l.topic)}</span><h2>${esc(l.title)}</h2>${['curve','derivative','integral'].includes(l.art)?graph(l.art):visual({visual:l.art==='balance'?'balance':l.art==='fraction'?'sail':'planks'})}<div class="lesson-demo"><p>${esc(l.demo)}</p>${l.teach&&!taught?'<button id="learned" class="primary" style="margin-top:12px">I HAVE EXPLORED THE EXAMPLE — MY TURN →</button>':''}</div>${!l.teach||taught?`<div id="lessonForm" role="group" aria-label="Lesson answer"><p class="story" style="margin-bottom:12px">${esc(l.prompt)}</p><div class="answerrow"><input id="lessonAnswer" value="${esc(lessonDraft)}" autocomplete="off" maxlength="64" inputmode="decimal" aria-label="Lesson answer"><span class="unit">${esc(l.unit)}</span></div><div class="actions"><button class="primary" id="lessonSubmit" type="button">TEST MY IDEA →</button><button id="lessonHint" type="button">HINT</button></div></div>`:''}<p class="feedback ${wrong?'wrong':''}" role="status">${esc(feedback)}</p><div class="actions"><button id="lessonBack">← CHART ROOM</button></div></div>`;}
function post(type,data={}){if(channel)parent.postMessage({channel,type,...data},'*');}function save(){post('progress',{state:G.validate(state)});}function render(){document.body.innerHTML=`<header class="masthead"><div class="brand"><b>FUN</b><div><span class="small">Solo prototype · name to come</span><p>Bootstrap’s fictional adventure</p></div></div><nav><button id="chartNav">Chart Room</button><button id="pauseBtn">Pause</button></nav></header><main class="workspace">${map()}<section class="playpanel"><div class="journal">${mate}<div><b>Bootstrap · your first mate</b><p>“A sound ship. A clear heading. Let’s begin.”</p></div></div>${screen==='charts'?charts():task()}</section></main><footer class="footer"><span>Fictional game only · No business records or real authority</span><span>Progress stays in this page; use Save game file above to keep it.</span></footer>${paused?'<div class="pause" role="dialog" aria-modal="true"><span class="small">At anchor</span><h2>The sea can wait.</h2><p>No timer, no lost lives. Your current voyage stays here while this page remains open. Admiral session limits still apply.</p><button id="resume" class="primary">RESUME VOYAGE →</button></div>':''}`;document.body.classList.toggle('game-paused',paused);bind();}
function perform(type,value){const stage=state.stage,r=G.act(state,{type,value,stage});state=r.state;if(r.hint){feedback=r.message;wrong=false;}else if(r.ok){finishMessage=r.message;feedback='';wrong=false;answerDraft='';}else{feedback=r.message;wrong=true;}save();render();}
function bind(){const on=(id,fn)=>$(id)?.addEventListener('click',fn);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>perform('choose',b.dataset.choice));on('answerSubmit',()=>perform('answer',$('answer').value));$('answer')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();perform('answer',$('answer').value);}});$('answer')?.addEventListener('input',()=>{answerDraft=$('answer').value;if(G.current(state)?.visual!=='crates')return;const n=G.number($('answer').value);if(!Number.isInteger(n)||n<0||n>8)return;$('cargoVisual').innerHTML=[1,2,3].map(i=>`<div class="boatload"><b>Boat ${i}</b>${'<span class="crate"></span>'.repeat(n)}</div>`).join('');});on('hint',()=>perform('hint'));on('next',()=>{finishMessage='';render();});on('charts',()=>{screen='charts';lesson='';render();});on('chartNav',()=>{screen='charts';lesson='';feedback='';render();});on('toHarbor',()=>{screen='mission';lesson='';feedback='';render();});on('lessonBack',()=>{lesson='';feedback='';wrong=false;render();});on('pauseBtn',()=>{paused=true;render();});on('resume',()=>{paused=false;render();});on('replay',()=>{replayPending=true;render();});on('cancelReplay',()=>{replayPending=false;render();});on('confirmReplay',()=>{state=G.fresh();replayPending=false;finishMessage='';feedback='';answerDraft='';save();render();});on('tern',()=>{secret=true;feedback='A little tern drops a bright shell onto the deck. Bootstrap calls it Pip. Some discoveries need curiosity, not an equation.';wrong=false;render();});document.querySelectorAll('[data-pennant]').forEach(b=>b.onclick=()=>{state.pennant=b.dataset.pennant;save();render();});document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{lesson=b.dataset.lesson;taught=false;lessonDraft='';feedback='';wrong=false;render();});on('learned',()=>{taught=true;render();});on('lessonHint',()=>{feedback=G.lessons.find(l=>l.id===lesson).hint;wrong=false;render();});$('lessonAnswer')?.addEventListener('input',()=>{lessonDraft=$('lessonAnswer').value;});const submitLesson=()=>{const r=G.checkLesson(lesson,$('lessonAnswer').value,taught);feedback=r.message;wrong=!r.ok;if(r.ok&&!state.lessons.includes(lesson)){state.lessons.push(lesson);save();}render();};on('lessonSubmit',submitLesson);$('lessonAnswer')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitLesson();}});}
window.addEventListener('message',e=>{if(e.source!==parent||parent===window||!e.data||typeof e.data.channel!=='string')return;const d=e.data;if(d.type==='start'&&!channel){try{state=G.validate(d.state);channel=d.channel;render();post('ready');}catch(_){}}else if(d.channel===channel&&d.type==='restore'){try{state=G.validate(d.state);finishMessage='';feedback='';screen='mission';paused=false;answerDraft='';lessonDraft='';render();}catch(_){}}else if(d.channel===channel&&d.type==='pause'){paused=true;render();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&channel){paused=true;render();}});
})();
</script></body></html>
